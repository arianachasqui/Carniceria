<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Carnicos Nuevo Amanecer</title>
<meta name="theme-color" content="#141414">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Nuevo Amanecer">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js" defer></script>
<style>
:root{--vino:#141414;--vino2:#0b0b0b;--rojo:#3d3d3d;--oro:#c9a24b;--oro2:#e8d29a;--marfil:#f3f2ef;--marfil2:#e5e4e0;--tinta:#161616;--suave:#6b6b6b;--linea:#d9d7d0;--verde:#7a5c10;--sangre:#3d3d3d;--carbon:#0b0b0b;--hueso:#f3f2ef;--hueso-osc:#e5e4e0;--carbon-suave:#6b6b6b;--font:'Cormorant Garamond',Georgia,'Times New Roman',serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--marfil);color:var(--tinta);font:15px/1.45 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
.mast{background:linear-gradient(160deg,#050505,#141414 55%,#2e2e2e);text-align:center;padding:calc(env(safe-area-inset-top,0px) + 22px) 16px 18px;border-bottom:3px solid var(--oro)}
.mast h1{font:700 clamp(25px,7.2vw,36px)/1.1 var(--font);margin:0;color:var(--oro2);letter-spacing:.06em}
.mast p{margin:6px 0 0;color:#e9d9b6;font-size:13px;letter-spacing:.04em}
.mast .mk{color:var(--oro);font-size:14px;margin-bottom:6px}
.tabs{position:sticky;top:0;z-index:20;display:flex;gap:2px;overflow-x:auto;background:var(--marfil);border-bottom:1px solid var(--linea);padding:0 8px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;padding:14px 14px 11px;font:600 18px var(--font);color:var(--suave);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
.tab.active{color:var(--vino);border-bottom-color:var(--oro)}
.tab b{background:var(--rojo);color:#fff;border-radius:9px;font:700 11px system-ui;padding:1px 6px;margin-left:5px;vertical-align:2px}
.wrap{max-width:900px;margin:0 auto;padding:18px 14px calc(env(safe-area-inset-bottom,0px) + 70px)}
.panel{display:none}.panel.active{display:block}
.card{background:#fff;border:1px solid var(--linea);border-radius:10px;padding:18px;margin-bottom:16px;box-shadow:0 1px 0 var(--oro2)}
.card h2{font:700 24px var(--font);color:var(--vino);margin:0 0 14px;padding-bottom:8px;border-bottom:1px solid var(--oro)}
label{display:block;font-size:12px;font-weight:600;color:var(--suave);margin:12px 0 5px;letter-spacing:.03em}
input,select{width:100%;padding:12px;border:1.5px solid var(--linea);border-radius:8px;font-size:16px;background:var(--marfil);color:var(--tinta)}
input:focus,select:focus{outline:none;border-color:var(--oro)}
button{font-family:inherit}
.btn{background:var(--vino);color:var(--oro2);border:1px solid var(--oro);padding:12px 20px;border-radius:8px;font-weight:700;font-size:15px;cursor:pointer;letter-spacing:.03em}
.btn:active{background:var(--vino2)}
.btn.oro{background:linear-gradient(180deg,#dcb865,var(--oro));color:var(--vino2);border-color:#a8832f}
.btn.secundario{background:transparent;color:var(--vino);border:1.5px solid var(--oro)}
.btn.peq{padding:7px 12px;font-size:13px}.btn.full{display:block;width:100%;margin-top:10px}
.btn-row{margin-top:14px;display:flex;gap:10px;flex-wrap:wrap}
.helptext{font-size:12.5px;color:var(--suave)}
.empty{text-align:center;padding:26px 10px;color:var(--suave)}
.save-msg{font-size:13px;color:var(--verde);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;padding:9px 10px;background:var(--vino);color:var(--oro2);font-size:12px;letter-spacing:.04em}
td{padding:9px 10px;border-bottom:1px solid var(--linea)}
.num{text-align:right;font-variant-numeric:tabular-nums}.pos{color:var(--verde);font-weight:700}.neg{color:var(--rojo);font-weight:700}
.del{cursor:pointer;color:var(--suave);font-size:18px;padding:4px 8px}.del:hover{color:var(--rojo)}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:16px}
.stat{background:var(--vino);color:var(--marfil);border-radius:10px;padding:16px;border:1px solid var(--oro)}
.stat .label{font-size:12px;color:#e3cf9f;margin-bottom:4px}.stat .val{font:700 28px var(--font);color:var(--oro2)}
.stat.oro{background:linear-gradient(180deg,#dcb865,var(--oro));border-color:#a8832f}.stat.oro .label{color:var(--vino)}.stat.oro .val{color:var(--vino2)}
.stat.rojo{background:#3d3d3d}.stat.verde{background:#2a2a2a;border-color:var(--oro)}.stat.verde .val{color:var(--oro2)}
.month-select{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}.month-select select{width:auto;min-width:170px}
.semanas-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.semana-btn{padding:7px 14px;border-radius:16px;font-size:13px;font-weight:600;cursor:pointer;background:var(--marfil2);color:var(--suave)}
.semana-btn.active{background:var(--vino);color:var(--oro2)}.semana-btn .rango{margin-left:4px;font-weight:400}
.cliente-tag,.metodo-tag{display:inline-block;background:var(--marfil2);padding:2px 9px;border-radius:10px;font-size:12px}
.estado-tag{display:inline-block;padding:3px 10px;border-radius:10px;font-size:12px;font-weight:700}
.estado-tag.pagado{background:#f1e6c0;color:#7a5c10}.estado-tag.pendiente{background:#141414;color:#e8d29a}.estado-tag.abono{background:#dcdcdc;color:#333}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--linea);background:var(--marfil);color:var(--tinta);padding:10px 16px;border-radius:22px;font-size:15px;cursor:pointer}
.chip.on{background:var(--vino);color:var(--oro2);border-color:var(--oro)}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1.5px solid var(--oro);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--marfil);padding:13px 8px;font-size:15px;font-weight:600;color:var(--suave);cursor:pointer}
.seg button.on{background:var(--vino);color:var(--oro2)}.seg button.on.mal{background:var(--rojo)}
.linea{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--linea);cursor:pointer}
.linea .pimg{width:52px;height:52px;flex:none}.linea .t{flex:1}.linea .t span{display:block;font-size:13px;color:var(--suave)}.linea b.m{font:700 20px var(--font);color:var(--vino)}
.total{display:flex;justify-content:space-between;align-items:baseline;padding:14px 0 2px;font:700 26px var(--font);color:var(--vino)}
.pimg{border-radius:10px;overflow:hidden;background:var(--vino);border:1px solid var(--oro);aspect-ratio:1}.pimg img,.pimg svg{width:100%;height:100%;object-fit:cover;display:block}
.gp{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px;margin-bottom:6px}
.prod{position:relative;background:#fff;border:1px solid var(--linea);border-radius:12px;padding:8px;text-align:center;cursor:pointer;display:flex;flex-direction:column;gap:3px}
.prod:active{border-color:var(--oro)}.prod b{font:700 16px/1.1 var(--font);color:var(--vino);margin-top:4px}.prod span{font-size:13px;color:var(--suave)}
.prod .bd{position:absolute;top:4px;right:4px;z-index:2;background:var(--oro);color:var(--vino2);font:700 12px system-ui;padding:2px 7px;border-radius:10px}
#sheet{display:none}#sheet.on{display:block}
.back{position:fixed;inset:0;background:rgba(10,10,10,.68);z-index:50}
.hoja{position:fixed;left:0;right:0;bottom:0;z-index:51;background:var(--marfil);border-radius:18px 18px 0 0;border-top:3px solid var(--oro);padding:16px 16px calc(env(safe-area-inset-bottom,0px) + 18px);max-height:92vh;overflow-y:auto;max-width:640px;margin:0 auto;animation:sube .18s ease-out}
@keyframes sube{from{transform:translateY(40px);opacity:0}}
.hh{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.hh h3,.hoja h3{font:700 26px var(--font);color:var(--vino);margin:0}
.x{border:0;background:none;font-size:22px;color:var(--suave);cursor:pointer;padding:4px 8px}
.qv{text-align:center}.qv .pimg{width:110px;margin:0 auto 8px}
.stepper{display:flex;gap:10px;align-items:center;justify-content:center;margin:10px 0 2px}
.stepper button{width:62px;height:62px;border-radius:50%;border:1.5px solid var(--oro);background:var(--vino);color:var(--oro2);font-size:30px;cursor:pointer}
.stepper input{width:130px;text-align:center;font:700 40px var(--font);padding:4px;border-color:var(--oro)}
.qv .chips{justify-content:center;margin:12px 0}.qv .sub{font:700 24px var(--font);color:var(--vino);margin:10px 0}
.qv label{text-align:left}
.sep{text-align:center;color:var(--suave);font-size:13px;margin:16px 0 10px}
.deuda{display:flex;justify-content:space-between;align-items:center;padding:14px 4px;border-bottom:1px solid var(--linea);cursor:pointer}
.deuda b{font:700 22px var(--font);color:var(--vino)}.deuda span{font-size:13px;color:var(--suave);display:block}.deuda .neg{font:700 24px var(--font)}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);transform:translateX(-50%);background:var(--vino2);color:var(--oro2);border:1px solid var(--oro);padding:10px 18px;border-radius:22px;z-index:99;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
.ph{display:flex;gap:14px;align-items:center}.ph .pimg{width:96px;flex:none}
@media(prefers-reduced-motion:reduce){.hoja{animation:none}}

.gfijos{display:grid;grid-template-columns:1fr 1fr;gap:10px}.gfijos .chip{padding:16px 10px;font:700 20px var(--font);text-align:center;border-radius:12px}
.el{display:grid;grid-template-columns:1fr 62px 84px 26px;gap:6px;margin-bottom:8px;align-items:center}.el select,.el input{padding:10px 6px;font-size:15px}
/* ---- Aire y catálogo en 3 columnas ---- */
.gp{grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:12px}
.prod{padding:7px 6px 10px;gap:4px}
.prod b{font-size:15px;line-height:1.15;min-height:2.3em;display:flex;align-items:center;justify-content:center;overflow-wrap:anywhere}
.prod span{font-size:12px;line-height:1.3}
.acc{display:flex;flex-direction:column;gap:4px}
.acc .del{padding:2px 6px}
.wrap{padding:22px 16px calc(env(safe-area-inset-bottom,0px) + 80px)}
.card{padding:22px 18px;margin-bottom:22px;border-radius:12px}
.card h2{font-size:23px;margin-bottom:18px;padding-bottom:10px}
label{margin:18px 0 8px}
.chips{gap:10px}
.btn.full{margin-top:16px;padding:14px 20px}
.linea{padding:16px 0;gap:14px}
.deuda{padding:18px 4px}
.stat-grid{gap:14px;margin-bottom:20px}.stat{padding:18px}
td{padding:12px 10px}th{padding:11px 10px}
.seg button{padding:15px 8px}
.hoja{padding:22px 18px calc(env(safe-area-inset-bottom,0px) + 22px)}
.hh{margin-bottom:18px}
.qv .chips{margin:16px 0}.stepper{margin:14px 0 6px}
.el{gap:8px;margin-bottom:12px}
.tab{padding:16px 16px 13px}
@media(max-width:600px){
  .mast{padding:calc(env(safe-area-inset-top,0px) + 16px) 16px 16px}
  .mast .mk{margin-bottom:4px}.mast p{font-size:12px}
  .wrap{padding:18px 14px calc(env(safe-area-inset-bottom,0px) + 80px)}
  .card{padding:20px 16px}
  .gp{gap:10px}.prod b{font-size:14px}.prod span{font-size:11.5px}
  .gfijos{gap:12px}
}
</style></head>
<body><div id="app-root"></div><div id="sheet"></div><div id="toast"></div>
<script>
(function(){
  const KEY_COMPRAS="carniceria-compras-v2",KEY_VENTAS="carniceria-ventas-v2",KEY_GASTOS="carniceria-gastos",KEY_OLD_REGISTROS="carniceria-registros",KEY_PROD="carniceria-productos-v1";
  let compras=[],ventas=[],gastos=[],productos=[];
  let activeTab="ventas",mesResumenActual=null,semanaResumenActual=null,ventasVis=15,comprasVis=20;
  const root=document.getElementById('app-root');
  const TABS=[['ventas','Ventas'],['deudores','Deudores'],['compras','Compras'],['inventario','Inventario'],['gastos','Gastos'],['resumen','Resumen'],['catalogo','Catálogo']];
  const hoyStr=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
  const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
  const fmt=n=>(isNaN(n)?0:n).toLocaleString('es-CO',{maximumFractionDigits:2});
  const money=n=>"$"+Math.round(isNaN(n)?0:n).toLocaleString('es-CO');
  const mesKey=f=>f?f.slice(0,7):"";
  const num=v=>parseFloat(String(v).replace(',','.'))||0;
  const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  function mesLabel(k){if(!k)return"";const[y,m]=k.split('-');return["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"][m-1]+" "+y}
  const fechaCorta=f=>{const[y,m,d]=f.split('-');return d+" "+["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"][m-1]};
  const cart={venta:{items:[],cliente:'',metodo:'efectivo',debe:false,fecha:hoyStr()},compra:{items:[],fecha:hoyStr()}};
  const sumCart=it=>it.reduce((s,i)=>s+i.libras*i.precio,0);

  // ---------- Catálogo de productos ----------
  async function iniciarProductos(){
    try{productos=JSON.parse(localStorage.getItem(KEY_PROD)||'null')||null}catch(e){productos=null}
    if(productos)return;
    const m={},nm=t=>String(t).trim().toUpperCase(),get=k=>m[k]||(m[k]={nombre:k,precio:0,costo:0});
    [...compras].sort((a,b)=>a.fecha.localeCompare(b.fecha)).forEach(c=>{get(nm(c.tipo)).costo=c.costoLibra});
    [...ventas].sort((a,b)=>a.fecha.localeCompare(b.fecha)).forEach(v=>{get(nm(v.tipo)).precio=v.precioLibra});
    productos=Object.values(m).map(p=>({id:uid(),img:null,...p,precio:p.precio||Math.round(p.costo*1.3/500)*500})).sort((a,b)=>a.nombre.localeCompare(b.nombre));
    guardarProd();
  }
  function guardarProd(){try{localStorage.setItem(KEY_PROD,JSON.stringify(productos))}catch(e){toast('No hay espacio para guardar la foto')}pedirSync()}
  function ilus(n){n=n.toUpperCase();const c=/CERDO|LOMO|TOCINO|CHORIZO/.test(n)?'#d98f8f':/AHUMAD/.test(n)?'#7a3524':'#b02a37';
    const f=/COSTILLA/.test(n)?`<rect x="18" y="30" width="64" height="40" rx="9" fill="${c}"/><path d="M30 34v32M44 34v32M58 34v32M72 34v32" stroke="#f3e6c4" stroke-width="4" stroke-linecap="round"/>`
    :/MOLID/.test(n)?`<path d="M14 74Q18 36 50 32Q82 36 86 74Z" fill="${c}"/><g fill="#ffffff55"><circle cx="38" cy="60" r="3"/><circle cx="56" cy="52" r="3"/><circle cx="66" cy="64" r="3"/><circle cx="48" cy="68" r="3"/></g>`
    :`<path d="M16 52Q14 28 46 26Q84 22 86 52Q88 76 52 76Q18 78 16 52Z" fill="${c}"/><circle cx="64" cy="48" r="9" fill="#f3e6c4"/><path d="M28 44Q40 38 50 46M30 58Q44 52 54 60" stroke="#ffffff66" stroke-width="3" fill="none" stroke-linecap="round"/>`;
    return`<svg viewBox="0 0 100 100"><rect width="100" height="100" fill="#1a1a1a"/><rect x="4" y="4" width="92" height="92" rx="8" fill="none" stroke="#c9a24b" stroke-width="1.2"/>${f}</svg>`}
  const pimg=p=>p.img?`<img src="${p.img}" alt="">`:ilus(p.nombre);

  // ---------- Hojas (ventanas inferiores) ----------
  function hoja(html){const s=document.getElementById('sheet');s.innerHTML=`<div class="back"></div><div class="hoja">${html}</div>`;s.classList.add('on');document.body.style.overflow='hidden';s.querySelector('.back').onclick=cerrar;s.querySelectorAll('[data-c]').forEach(b=>b.onclick=cerrar);return s}
  function cerrar(){const s=document.getElementById('sheet');s.classList.remove('on');s.innerHTML='';document.body.style.overflow='';render()}
  function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),1800)}

  function catalogo(ctx){
    const items=cart[ctx].items,cnt=n=>items.filter(i=>i.tipo===n).reduce((s,i)=>s+i.libras,0);
    const s=hoja(`<div class="hh"><h3>Elige un producto</h3><button class="x" data-c>✕</button></div>
      <div class="gp">${productos.map(p=>`<button class="prod" data-p="${p.id}">${cnt(p.nombre)?`<i class="bd">${fmt(cnt(p.nombre))} lb</i>`:''}<div class="pimg">${pimg(p)}</div><b>${esc(p.nombre)}</b><span>${money(ctx==='venta'?p.precio:p.costo)}/lb</span></button>`).join('')||'<div class="empty">El catálogo está vacío. Crea productos en la pestaña Catálogo.</div>'}</div>
      <button class="btn oro full" data-c>Listo${items.length?` (${items.length})`:''}</button>`);
    s.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>cantidad(ctx,b.dataset.p,-1));
  }

  function cantidad(ctx,pid,idx){
    const p=productos.find(x=>x.id===pid),it=cart[ctx].items,ex=idx>=0?it[idx]:null;
    let q=ex?ex.libras:1;const pr0=ex?ex.precio:(ctx==='venta'?p.precio:p.costo);
    const s=hoja(`<div class="qv"><div class="pimg">${pimg(p)}</div><h3>${esc(p.nombre)}</h3>
      <div class="stepper"><button data-s="-0.5">−</button><input id="q" inputmode="decimal" value="${q}"><button data-s="0.5">+</button></div><div class="helptext">libras</div>
      <div class="chips">${[0.5,1,2,3,5,10].map(v=>`<button class="chip" data-v="${v}">${v}</button>`).join('')}</div>
      <label>Precio por libra</label><input id="pr" type="number" inputmode="numeric" value="${pr0}">
      <div class="sub" id="st"></div>
      <button class="btn oro full" id="ok">${ex?'Guardar cambios':'Agregar al pedido'}</button>
      ${ex?'<button class="btn secundario full" id="rm">Quitar del pedido</button>':''}
      <button class="btn secundario full" id="bk">${ex?'Cancelar':'Volver al catálogo'}</button></div>`);
    const qi=s.querySelector('#q'),pi=s.querySelector('#pr'),st=s.querySelector('#st');
    const calc=()=>{st.textContent='Subtotal: '+money(num(qi.value)*num(pi.value))};calc();
    qi.oninput=pi.oninput=calc;
    s.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{qi.value=Math.max(0,Math.round((num(qi.value)+parseFloat(b.dataset.s))*100)/100);calc()});
    s.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{qi.value=b.dataset.v;calc()});
    const volver=()=>ex?cerrar():catalogo(ctx);
    s.querySelector('#bk').onclick=volver;
    if(ex)s.querySelector('#rm').onclick=()=>{it.splice(idx,1);cerrar()};
    s.querySelector('#ok').onclick=()=>{
      const libras=num(qi.value),precio=num(pi.value);
      if(libras<=0){toast('Pon las libras');return}
      if(ex){ex.libras=libras;ex.precio=precio;cerrar();return}
      const m=it.find(i=>i.tipo===p.nombre&&i.precio===precio);
      if(m)m.libras+=libras;else it.push({tipo:p.nombre,libras,precio});
      toast('✓ '+p.nombre+' agregado');catalogo(ctx);
    };
  }

  const listaItems=ctx=>{const it=cart[ctx].items;return it.length?it.map((i,n)=>{const p=productos.find(x=>x.nombre===i.tipo)||{nombre:i.tipo};return`<div class="linea" data-e="${ctx}:${n}"><div class="pimg">${pimg(p)}</div><div class="t"><b>${esc(i.tipo)}</b><span>${fmt(i.libras)} lb × ${money(i.precio)}</span></div><b class="m">${money(i.libras*i.precio)}</b></div>`}).join('')+`<div class="total"><span>Total</span><span>${money(sumCart(it))}</span></div>`:'<div class="empty">Aún no hay productos en el pedido.</div>'};

        return`<div class="linea" style="cursor:default"><div class="t"><b>${esc(g.cliente)}</b> <span style="display:inline">· ${fechaCorta(g.fecha)}</span><span>${g.items.map(i=>esc(i.tipo)+' '+fmt(i.libras)+' lb').join(' · ')}</span></div><div style="text-align:right"><b class="m">${money(t)}</b><br><span class="estado-tag ${st}">${st==='pagado'?'Pagó':st==='abono'?'Abonó':'Debe'}</span></div><div class="acc"><span class="del" data-eg="${esc(g.key)}">✎</span><span class="del" data-dg="${esc(g.key)}">✕</span></div></div>`}).join('')+(grupos.length>vis.length?`<button class="btn secundario full" id="mas">Ver más (${grupos.length-vis.length})</button>`:''):'<div class="empty">Sin ventas todavía.</div>'}</div>`;

    p.querySelector('#nc').onclick=()=>{const s=hoja(`<h3>Nuevo cliente</h3><label>Nombre</label><input id="n" autocomplete="off"><button class="btn oro full" id="g">Usar este cliente</button>`);const i=s.querySelector('#n');setTimeout(()=>i.focus(),50);s.querySelector('#g').onclick=()=>{const n=i.value.trim().toUpperCase();if(!n){toast('Escribe el nombre');return}v.cliente=n;cerrar()}};

  // ---------- Deudores ----------
  function aplicarPago(cliente,monto){
    let resta=monto;
    ventas.filter(v=>v.cliente===cliente).sort((a,b)=>a.fecha.localeCompare(b.fecha)).forEach(v=>{
      const tot=v.libras*v.precioLibra,saldo=tot-montoPagadoVenta(v);if(saldo<=.004||resta<=0)return;
      const pg=Math.min(saldo,resta);resta-=pg;v.montoPagado=montoPagadoVenta(v)+pg;v.pagado=v.montoPagado>=tot-.004;
    });
    return guardarVentas();
  }
  function renderDeudores(){
    const p=document.getElementById('panel-deudores'),cb=cuentasPorCobrar(),ns=Object.keys(cb).sort((a,b)=>cb[b].total-cb[a].total),tot=ns.reduce((s,n)=>s+cb[n].total,0);
    p.innerHTML=`<div class="stat-grid"><div class="stat oro"><div class="label">Total por cobrar</div><div class="val">${money(tot)}</div></div><div class="stat"><div class="label">Personas que deben</div><div class="val">${ns.length}</div></div></div>
      <div class="card"><h2>Quiénes deben</h2>${ns.length?ns.map(n=>{const f=cb[n].items.map(i=>i.fecha).sort()[0];return`<div class="deuda" data-n="${esc(n)}"><div><b>${esc(n)}</b><span>Desde el ${fechaCorta(f)} · ${agruparVentas(cb[n].items).length} compra(s)</span></div><div class="neg">${money(cb[n].total)}</div></div>`}).join(''):'<div class="empty">Nadie debe. Todo está al día ✦</div>'}</div>`;
    p.querySelectorAll('[data-n]').forEach(e=>e.onclick=()=>deudor(e.dataset.n));
  }
  function deudor(n){
    const d=cuentasPorCobrar()[n];if(!d){cerrar();return}
    const gs=agruparVentas(d.items).sort((a,b)=>a.fecha.localeCompare(b.fecha));
    const s=hoja(`<div class="hh"><h3>${esc(n)}</h3><button class="x" data-c>✕</button></div>
      <div class="total" style="padding-top:0"><span>Debe</span><span class="neg">${money(d.total)}</span></div>
      ${gs.map(g=>`<div class="linea" style="cursor:default"><div class="t"><b>${fechaCorta(g.fecha)}</b><span>${g.items.map(i=>esc(i.tipo)+' '+fmt(i.libras)+' lb').join(' · ')}</span></div><b class="m">${money(g.items.reduce((s,i)=>s+i.libras*i.precioLibra-montoPagadoVenta(i),0))}</b></div>`).join('')}
      <button class="btn oro full" id="todo">✓ Pagó completo · ${money(d.total)}</button>
      <div class="sep">— o abonó —</div>

      <label>Valor del abono</label><input id="ab" type="number" inputmode="numeric" placeholder="0">
      <button class="btn full" id="okab">Registrar abono</button>`);
    const ab=s.querySelector('#ab');
    s.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{ab.value=Math.min(d.total,num(ab.value)+ +b.dataset.a)});
    s.querySelector('#todo').onclick=async()=>{if(!confirm(n+' pagó '+money(d.total)+'?'))return;await aplicarPago(n,d.total);toast('✓ '+n+' quedó al día');cerrar()};
    s.querySelector('#okab').onclick=async()=>{const m=Math.min(num(ab.value),d.total);if(m<=0)return toast('Pon el valor del abono');await aplicarPago(n,m);toast('✓ Abono de '+money(m));const r=cuentasPorCobrar()[n];r?(render(),deudor(n)):cerrar()};
  }

  // ---------- Catálogo ----------
  function renderCatalogo(){
    const p=document.getElementById('panel-catalogo');

    s.querySelector('#g').onclick=()=>{const nombre=s.querySelector('#nm').value.trim().toUpperCase();if(!nombre)return toast('Falta el nombre');const o={nombre,precio:num(s.querySelector('#pv2').value),costo:num(s.querySelector('#co').value),img};if(id)Object.assign(x,o);else productos.push({id:uid(),...o});productos.sort((a,b)=>a.nombre.localeCompare(b.nombre));guardarProd();cerrar()};
    if(id)s.querySelector('#d').onclick=()=>{if(!confirm('¿Eliminar '+x.nombre+' del catálogo? Tus ventas e historial no se borran.'))return;productos=productos.filter(p=>p.id!==id);guardarProd();cerrar()};
  }


  // ---------- Editar venta (lápiz) ----------
  function editarVenta(k){
    const g=agruparVentas(ventas).find(x=>x.key===k);if(!g)return;
    const tot0=g.items.reduce((s,i)=>s+i.libras*i.precioLibra,0),pg0=g.items.reduce((s,i)=>s+montoPagadoVenta(i),0);
    const est0=pg0>=tot0-.004?'pagado':pg0>.004?'abono':'debe';
    let L=g.items.map(i=>({tipo:i.tipo,libras:i.libras,precio:i.precioLibra})),est=est0,cli=g.cliente,met=g.items[0].metodoPago||'efectivo',fe=g.fecha;
    const clientes=[...new Set(ventas.map(v=>v.cliente))].sort(),nombres=()=>[...new Set([...productos.map(p=>p.nombre),...L.map(l=>l.tipo)])];
    const pintar=()=>{
      const opts=[['pagado','Pagó'],['debe','Queda debiendo'],...(est0==='abono'?[['abono','Abonó (igual)']]:[])];
      const s=hoja(`<div class="hh"><h3>Editar venta</h3><button class="x" data-c>✕</button></div>
        <label style="margin-top:0">Cliente</label><select id="ec">${clientes.map(c=>`<option ${c===cli?'selected':''}>${esc(c)}</option>`).join('')}</select>
        <label>Productos</label>${L.map((l,n)=>`<div class="el"><select data-t="${n}">${nombres().map(t=>`<option ${t===l.tipo?'selected':''}>${esc(t)}</option>`).join('')}</select><input data-l="${n}" type="number" inputmode="decimal" value="${l.libras}"><input data-p="${n}" type="number" inputmode="numeric" value="${l.precio}"><span class="del" data-r="${n}">✕</span></div>`).join('')}
        <div class="helptext">Producto · libras · precio por libra</div>
        <button class="btn secundario full" id="al">＋ Agregar línea</button>
        <label>Pago</label><div class="seg" style="grid-template-columns:repeat(${opts.length},1fr)">${opts.map(([v,t])=>`<button data-e="${v}" class="${est===v?'on':''}">${t}</button>`).join('')}</div>
        <label>Forma de pago</label><div class="seg"><button data-m="efectivo" class="${met==='efectivo'?'on':''}">Efectivo</button><button data-m="transferencia" class="${met==='transferencia'?'on':''}">Transferencia</button></div>
        <label>Fecha</label><input type="date" id="ef" value="${fe}">
        <div class="total"><span>Total</span><span>${money(L.reduce((a,l)=>a+l.libras*l.precio,0))}</span></div>
        <button class="btn oro full" id="gu">Guardar cambios</button><button class="btn secundario full" data-c>Cancelar</button>`);
      s.querySelector('#ec').onchange=e=>{cli=e.target.value};s.querySelector('#ef').onchange=e=>{fe=e.target.value};
      s.querySelectorAll('[data-t]').forEach(e=>e.onchange=()=>{L[e.dataset.t].tipo=e.value});
      s.querySelectorAll('[data-l]').forEach(e=>e.onchange=()=>{L[e.dataset.l].libras=num(e.value);pintar()});
      s.querySelectorAll('[data-p]').forEach(e=>e.onchange=()=>{L[e.dataset.p].precio=num(e.value);pintar()});
      s.querySelectorAll('[data-r]').forEach(e=>e.onclick=()=>{if(L.length<2)return toast('Debe quedar un producto');L.splice(e.dataset.r,1);pintar()});
      s.querySelector('#al').onclick=()=>{const p=productos[0];L.push({tipo:p?p.nombre:'',libras:1,precio:p?p.precio:0});pintar()};
      s.querySelectorAll('[data-e]').forEach(e=>e.onclick=()=>{est=e.dataset.e;pintar()});
      s.querySelectorAll('[data-m]').forEach(e=>e.onclick=()=>{met=e.dataset.m;pintar()});
      s.querySelector('#gu').onclick=async()=>{
        const ls=L.filter(l=>l.libras>0&&l.tipo);if(!ls.length)return toast('Pon libras en al menos un producto');
        const total=ls.reduce((a,l)=>a+l.libras*l.precio,0),gid=g.items[0].grupoId||uid(),ab=Math.min(pg0,total);
        ventas=ventas.filter(v=>claveGrupoVenta(v)!==k);
        ls.forEach(l=>{const t=l.libras*l.precio,pg=est==='pagado'?t:est==='debe'?0:(total>0?t*ab/total:0);ventas.push({id:uid(),grupoId:gid,fecha:fe||g.fecha,cliente:cli,tipo:l.tipo,libras:l.libras,precioLibra:l.precio,metodoPago:met,montoPagado:pg,pagado:pg>=t-.004})});
        await guardarVentas();toast('✓ Venta actualizada');cerrar();
      };
    };
    pintar();
  }

  // ---------- Gastos ----------
  const GFIJOS=[['INDRIVER',/INDRIVER/i],['DIEZMO',/DIEZMO/i],['SPOTIFY',/SPOT/i],['SUELDO',/SUELDO/i]],gs={concepto:'',monto:'',fecha:hoyStr(),otro:''};
  function renderGastos(){
    const p=document.getElementById('panel-gastos'),ord=[...gastos].sort((a,b)=>b.fecha.localeCompare(a.fecha));
    p.innerHTML=`<div class="card"><h2>Anotar gasto</h2>
      <div class="gfijos">${GFIJOS.map(([n])=>`<button class="chip ${gs.concepto===n?'on':''}" data-g="${n}">${n[0]+n.slice(1).toLowerCase()}</button>`).join('')}</div>

    p.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{const n=b.dataset.g;if(gs.concepto===n){gs.concepto='';}else{gs.concepto=n;gs.otro='';const u=ord.find(x=>GFIJOS.find(f=>f[0]===n)[1].test(x.concepto));gs.monto=u?u.monto:''}renderGastos()});
    p.querySelector('#go').oninput=e=>{gs.otro=e.target.value;gs.concepto='';p.querySelectorAll('[data-g]').forEach(c=>c.classList.remove('on'))};
    p.querySelector('#gm').oninput=e=>{gs.monto=e.target.value};p.querySelector('#gf').onchange=e=>{gs.fecha=e.target.value};
    p.querySelector('#gok').onclick=async()=>{
      const concepto=gs.concepto||gs.otro.trim().toUpperCase(),monto=num(gs.monto);

  async function sincronizar(manual){
    if(!sh.url)return;if(sincr){pendRe=true;return}sincr=true;
    try{
      for(let n=0;n<3;n++){
        const s=await shGet();
        if(s.ok===false&&s.error==='clave')throw new Error('La clave no coincide');
        const vacio=s.ok===false&&s.error==='vacio';
        if(!vacio&&(!s.ok||typeof s.rev!=='number'))throw new Error('Falta actualizar el código Code.gs en Google');
        const sv=vacio?null:s.datos,srev=vacio?0:s.rev,loc=snap();let base=null;try{base=JSON.parse(localStorage.getItem(KEY_BASE))}catch(e){}
        let push=false,baseRev=srev;
        if(!sv){push=true}
        else if(!base){
          if(sh.ok){push=true;baseRev=null}

          if(lc&&sc)await aplicar(merge3(base,loc,sv));

  }

  function existeCompra(c){
    return compras.some(x => x.fecha===c.fecha && x.tipo===c.tipo && Math.abs(x.libras-c.libras)<0.001 && Math.abs(x.costoLibra-c.costoLibra)<0.01);
  }
  function existeVenta(v){
    return ventas.some(x => x.fecha===v.fecha && x.cliente===v.cliente && x.tipo===v.tipo && Math.abs(x.libras-v.libras)<0.001 && Math.abs(x.precioLibra-v.precioLibra)<0.01);
  }
  function existeGasto(g){
    return gastos.some(x => x.fecha===g.fecha && x.concepto===g.concepto && Math.abs(x.monto-g.monto)<0.01);
  }

  // Gastos reales de octubre (según lo que se anotó en la app):
  //  10-oct: INDRIVER y DIEZMO ($10.000 c/u)
  //  06-oct: BOLSAS SIPLO $18.000, BOLSA NEGRA INDUSTRIAL $5.000, SPOTY DOS MESES $10.000
  // Se agregan solo si no existen (sin importar mayúsculas), y se limpian duplicados
  // y los gastos del 3-oct que no eran reales.
  async function agregarGastosOctubre(){
    const norm = t => String(t||'').trim().toUpperCase();
    let cambio = false;
    const antes = gastos.length;
    // quita los INDRIVER/DIEZMO del 3-oct (los había supuesto una versión anterior)
    gastos = gastos.filter(g => !(g.fecha==="2026-10-03" && (norm(g.concepto)==="INDRIVER" || norm(g.concepto)==="DIEZMO") && Math.abs(g.monto-10000)<0.01));
    if(gastos.length !== antes) cambio = true;
    const reales = [
      { fecha:"2026-10-10", concepto:"INDRIVER", monto:10000 },
      { fecha:"2026-10-10", concepto:"DIEZMO", monto:10000 },
      { fecha:"2026-10-06", concepto:"BOLSAS SIPLO", monto:18000 },
      { fecha:"2026-10-06", concepto:"BOLSA NEGRA INDUSTRIAL", monto:5000 },
      { fecha:"2026-10-06", concepto:"SPOTY DOS MESES", monto:10000 }
    ];
    reales.forEach(g=>{
      const hay = gastos.some(x => x.fecha===g.fecha && norm(x.concepto)===norm(g.concepto) && Math.abs(x.monto-g.monto)<0.01);
      if(!hay){ gastos.push({ id: uid(), ...g }); cambio = true; }
    });
    // quita duplicados exactos de octubre (misma fecha, concepto sin importar mayúsculas y monto)
    const vistos = new Set();
    const limpios = gastos.filter(g=>{
      if(!(g.fecha && g.fecha.startsWith("2026-10"))) return true;
      const k = g.fecha + "|" + norm(g.concepto) + "|" + g.monto;
      if(vistos.has(k)) return false;
      vistos.add(k); return true;
    });
    if(limpios.length !== gastos.length){ gastos = limpios; cambio = true; }
    if(cambio) await guardarGastos();
  }

  // ---------- Cálculos ----------
  function costoPromedioPorTipo(){
    const acc = {};
    compras.forEach(c=>{
      if(!acc[c.tipo]) acc[c.tipo] = { libras:0, costo:0 };
      acc[c.tipo].libras += c.libras;
      acc[c.tipo].costo += c.libras * c.costoLibra;
    });
    const prom = {};
    Object.keys(acc).forEach(t=>{ prom[t] = acc[t].libras > 0 ? acc[t].costo / acc[t].libras : 0; });
    return prom;
  }

  function inventarioPorTipo(){
    const prom = costoPromedioPorTipo();
    const inv = {};
    compras.forEach(c=>{ inv[c.tipo] = (inv[c.tipo]||0) + c.libras; });
    ventas.forEach(v=>{ inv[v.tipo] = (inv[v.tipo]||0) - v.libras; if(!(v.tipo in prom)) prom[v.tipo] = 0; });
    return inv;
  }

  function gananciaVenta(v, prom){
    const costo = (prom && (v.tipo in prom)) ? prom[v.tipo] : 0;
    return v.libras * (v.precioLibra - costo);
  }

  // Monto que el cliente ya pagó de esta venta (soporta ventas viejas que solo tenían pagado:true/false)
  function montoPagadoVenta(v){
    const total = v.libras * v.precioLibra;
    if(v.montoPagado !== undefined && v.montoPagado !== null){
      return Math.max(0, Math.min(v.montoPagado, total));
    }
    return v.pagado !== false ? total : 0;
  }

  // 'pagado' | 'abono' | 'pendiente'
  function estadoVenta(v){
    const total = v.libras * v.precioLibra;
    const pag = montoPagadoVenta(v);
    if(pag <= 0.004) return 'pendiente';
    if(pag >= total - 0.004) return 'pagado';
    return 'abono';
  }

  function librasVendidasPorTipo(listaVentas){
    const acc = {};
    listaVentas.forEach(v=>{ acc[v.tipo] = (acc[v.tipo]||0) + v.libras; });
    return acc;
  }

  function resumenMes(mesK){
    const comprasMes = compras.filter(c => mesKey(c.fecha) === mesK);
    const ventasMes = ventas.filter(v => mesKey(v.fecha) === mesK);
    const gastosMes = gastos.filter(g => mesKey(g.fecha) === mesK);
    const prom = costoPromedioPorTipo();
    let ganancia = 0, ventasTotal = 0, librasVendidas = 0, librasCompradas = 0, costoCompras = 0;
    let totalEfectivo = 0, totalTransferencia = 0, totalPendiente = 0;
    ventasMes.forEach(v=>{
      const monto = v.libras * v.precioLibra;
      const pagadoMonto = montoPagadoVenta(v);
      const saldo = Math.max(monto - pagadoMonto, 0);
      ganancia += gananciaVenta(v, prom);
      ventasTotal += monto;
      librasVendidas += v.libras;
      totalPendiente += saldo;
      if(pagadoMonto > 0){
        if((v.metodoPago||'efectivo') === 'transferencia'){ totalTransferencia += pagadoMonto; }
        else { totalEfectivo += pagadoMonto; }
      }
    });
    comprasMes.forEach(c=>{ librasCompradas += c.libras; costoCompras += c.libras * c.costoLibra; });
    const totalGastos = gastosMes.reduce((s,g)=> s + g.monto, 0);
    const neto = ganancia - totalGastos;
    return { comprasMes, ventasMes, gastosMes, ganancia, ventasTotal, librasVendidas, librasCompradas, costoCompras, totalGastos, neto, totalEfectivo, totalTransferencia, totalPendiente };
  }

  // Suma todo lo que compró cada cliente en el mes (res, cerdo, costilla, etc juntos)
  function totalesPorCliente(ventasMes){
    const acc = {};
    ventasMes.forEach(v=>{
      const total = v.libras * v.precioLibra;
      const pagado = montoPagadoVenta(v);
      const saldo = Math.max(total - pagado, 0);
      if(!acc[v.cliente]) acc[v.cliente] = { libras:0, total:0, pagado:0, saldo:0 };
      acc[v.cliente].libras += v.libras;
      acc[v.cliente].total += total;
      acc[v.cliente].pagado += pagado;
      acc[v.cliente].saldo += saldo;
    });
    return acc;
  }

  function mesesDisponibles(){
    const set = new Set();
    compras.forEach(c=> set.add(mesKey(c.fecha)));
    ventas.forEach(v=> set.add(mesKey(v.fecha)));
    gastos.forEach(g=> set.add(mesKey(g.fecha)));
    return Array.from(set).filter(Boolean).sort().reverse();
  }

  function cuentasPorCobrar(){
    const porCliente = {};
    ventas.forEach(v=>{
      const total = v.libras * v.precioLibra;
      const saldo = total - montoPagadoVenta(v);
      if(saldo > 0.004){
        if(!porCliente[v.cliente]) porCliente[v.cliente] = { total: 0, items: [] };
        porCliente[v.cliente].total += saldo;
        porCliente[v.cliente].items.push(v);
      }
    });
    return porCliente;
  }

  // Junta en un solo "recibo" todas las líneas de una misma venta (res, cerdo, costilla...)
  // Determina "Semana 1", "Semana 2"... NO según el calendario, sino según la fecha de la primera
  // venta que se haya anotado alguna vez. Esa fecha es siempre la Semana 1, y cada bloque de 7 días
  // hacia adelante es la semana siguiente (Semana 2, Semana 3...), sin reiniciar al cambiar de mes.
  function primeraFechaVenta(){
    if(ventas.length === 0) return null;
    return ventas.reduce((min, v) => (v.fecha && v.fecha < min ? v.fecha : min), ventas[0].fecha);
  }

  function diasEntreFechas(fechaA, fechaB){
    const [ya,ma,da] = fechaA.split('-').map(Number);
    const [yb,mb,db] = fechaB.split('-').map(Number);
    const msA = Date.UTC(ya, ma-1, da);
    const msB = Date.UTC(yb, mb-1, db);
    return Math.round((msB - msA) / 86400000);
  }

  function sumarDiasAFecha(fechaStr, dias){
    const [y,m,d] = fechaStr.split('-').map(Number);
    const dt = new Date(Date.UTC(y, m-1, d));
    dt.setUTCDate(dt.getUTCDate() + dias);
    return dt;
  }

  function fmtFechaCorta(dt){
    const meses = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
    return `${dt.getUTCDate()} ${meses[dt.getUTCMonth()]}`;
  }

  function semanaDeFecha(fechaStr){
    const primera = primeraFechaVenta() || fechaStr;
    const diff = diasEntreFechas(primera, fechaStr);
    const semanaNum = Math.floor(Math.max(diff, 0) / 7) + 1;
    const inicio = sumarDiasAFecha(primera, (semanaNum-1)*7);
    const fin = sumarDiasAFecha(primera, (semanaNum-1)*7 + 6);
    const key = `S${semanaNum}`;
    const rangoTexto = `${fmtFechaCorta(inicio)} – ${fmtFechaCorta(fin)}`;
    return { key, semanaNum, rangoTexto };
  }

  function claveGrupoVenta(v){ return v.grupoId || (v.fecha + '||' + v.cliente); }

  function agruparVentas(lista){
    const grupos = {};
    const orden = [];
    lista.forEach(v=>{
      const key = claveGrupoVenta(v);
      if(!grupos[key]){ grupos[key] = { key, fecha: v.fecha, cliente: v.cliente, items: [] }; orden.push(key); }
      grupos[key].items.push(v);
    });
    return orden.map(k=>grupos[k]);
  }

  // ---------- Panel Inventario ----------
  function renderInventario(){
    const p = document.getElementById('panel-inventario');
    const inv = inventarioPorTipo();
    const tipos = Object.keys(inv);
    p.innerHTML = `
      <div class="card">
        <h2>Inventario actual (libras disponibles por tipo)</h2>
        ${tipos.length===0 ? '<div class="empty">Sin datos todavía.</div>' : `
        <div class="stat-grid">
          ${tipos.sort().map(t=>`
            <div class="stat ${inv[t]<0 ? 'rojo':''}">
              <div class="label">${t}</div>
              <div class="val">${fmt(inv[t])} lb</div>
            </div>`).join('')}
        </div>
        <div class="helptext">Inventario = libras compradas acumuladas − libras vendidas acumuladas, por tipo de carne. Negativo significa que se vendió más de lo que aparece comprado.</div>
        `}
      </div>
    `;
  }

  // ---------- Panel Resumen Mensual ----------
  function renderResumen(){
    const p = document.getElementById('panel-resumen');
    const scrollVentanaAnterior = window.scrollY;
    const meses = mesesDisponibles();
    if(!mesResumenActual || !meses.includes(mesResumenActual)){ mesResumenActual = meses[0] || null; }
    if(meses.length === 0){
      p.innerHTML = `<div class="card"><div class="empty">Agrega compras, ventas o gastos para ver el resumen mensual.</div></div>`;
      return;
    }
    const r = resumenMes(mesResumenActual);
    const totalesTipoMes = librasVendidasPorTipo(r.ventasMes);
    const tiposMes = Object.keys(totalesTipoMes);
    const totalesClienteMes = totalesPorCliente(r.ventasMes);
    const prom = costoPromedioPorTipo();

    // Semanas del mes seleccionado, ordenadas de la Semana 1 en adelante
    const semanasInfo = {};
    r.ventasMes.forEach(v=>{
      const info = semanaDeFecha(v.fecha);
      if(!semanasInfo[info.key]) semanasInfo[info.key] = info;
    });
    const semanasDisponibles = Object.keys(semanasInfo).sort((a,b)=> semanasInfo[a].semanaNum - semanasInfo[b].semanaNum);
    if(!semanaResumenActual || !semanasDisponibles.includes(semanaResumenActual)){
      semanaResumenActual = semanasDisponibles[0] || null;
    }
    const ventasSemana = semanaResumenActual
      ? r.ventasMes.filter(v => semanaDeFecha(v.fecha).key === semanaResumenActual)
      : r.ventasMes;

    p.innerHTML = `
      <div class="card">
        <h2>Selecciona el mes</h2>
        <div class="month-select">
          <select id="sel-mes-resumen">
            ${meses.map(m=>`<option value="${m}" ${m===mesResumenActual?'selected':''}>${mesLabel(m)}</option>`).join('')}
          </select>
          <button class="btn secundario peq" id="btn-descargar-pdf" type="button">⬇ Descargar PDF</button>
        </div>
        <div class="stat-grid">
          <div class="stat verde"><div class="label">Ganancia bruta del mes</div><div class="val">${money(r.ganancia)}</div></div>
          <div class="stat"><div class="label">Total vendido (libras)</div><div class="val">${fmt(r.librasVendidas)} lb</div></div>
          <div class="stat oro"><div class="label">Ventas totales ($)</div><div class="val">${money(r.ventasTotal)}</div></div>
          <div class="stat rojo"><div class="label">Gastos del mes</div><div class="val">${money(r.totalGastos)}</div></div>
        </div>
        <div class="stat-grid" style="grid-template-columns:1fr;">
          <div class="stat" style="background:${r.neto>=0?'var(--verde)':'var(--sangre)'};">
            <div class="label">Ganancia neta (ganancia − gastos)</div>
            <div class="val">${money(r.neto)}</div>
          </div>
        </div>
      </div>

      <div class="card">
        <h2>Cómo cobraste este mes</h2>
        <div class="stat-grid">
          <div class="stat"><div class="label">Efectivo</div><div class="val">${money(r.totalEfectivo)}</div></div>
          <div class="stat" style="background:#4a4a4a;"><div class="label">Transferencia</div><div class="val">${money(r.totalTransferencia)}</div></div>
          <div class="stat rojo"><div class="label">Pendiente por cobrar</div><div class="val">${money(r.totalPendiente)}</div></div>
        </div>
      </div>

      <div class="card">
        <h2>Libras vendidas por tipo — ${mesLabel(mesResumenActual)}</h2>
        ${tiposMes.length===0 ? '<div class="empty">Sin ventas este mes.</div>' : `
        <div style="overflow-x:auto;"><table>
          <thead><tr><th>Tipo de carne</th><th>Libras vendidas</th></tr></thead>
          <tbody>
            ${tiposMes.sort().map(t=>`<tr><td>${t}</td><td class="num">${fmt(totalesTipoMes[t])} lb</td></tr>`).join('')}
            <tr class="total-row"><td>Total</td><td class="num">${fmt(r.librasVendidas)} lb</td></tr>
          </tbody>
        </table></div>`}
      </div>

      <div class="card">
        <h2>Total por cliente — ${mesLabel(mesResumenActual)}</h2>
        ${Object.keys(totalesClienteMes).length===0 ? '<div class="empty">Sin ventas este mes.</div>' : `
        <div style="overflow-x:auto;"><table>
          <thead><tr><th>Cliente</th><th>Libras (todas las carnes)</th><th>Total venta</th><th>Pagado</th><th>Debe</th></tr></thead>
          <tbody>
            ${Object.keys(totalesClienteMes).sort().map(c=>{
              const t = totalesClienteMes[c];
              return `<tr><td><span class="cliente-tag">${c}</span></td><td class="num">${fmt(t.libras)} lb</td><td class="num">${money(t.total)}</td><td class="num">${money(t.pagado)}</td><td class="num ${t.saldo>0.004?'neg':''}">${t.saldo>0.004?money(t.saldo):'—'}</td></tr>`;
            }).join('')}
            <tr class="total-row"><td>Total</td><td class="num">${fmt(r.librasVendidas)} lb</td><td class="num">${money(r.ventasTotal)}</td><td class="num">${money(r.totalEfectivo + r.totalTransferencia)}</td><td class="num">${money(r.totalPendiente)}</td></tr>
          </tbody>
        </table></div>`}
      </div>

      <div class="card">
        <h2>Ventas por cliente — ${mesLabel(mesResumenActual)}</h2>
        ${r.ventasMes.length===0 ? '<div class="empty">Sin ventas este mes.</div>' : `
        <div class="helptext" style="margin-bottom:8px;">Elige una semana para ver solo las ventas de esos días.</div>
        <div class="month-select" style="margin-bottom:14px;">
          <select id="sel-semana-resumen">
            ${semanasDisponibles.map(k=>{
              const info = semanasInfo[k];
              return `<option value="${k}" ${k===semanaResumenActual?'selected':''}>Semana ${info.semanaNum} · ${info.rangoTexto}</option>`;
            }).join('')}
          </select>
        </div>
        ${ventasSemana.length===0 ? '<div class="empty">Sin ventas en esta semana.</div>' : `
        <div class="${ventasSemana.length > 12 ? 'scroll-box' : ''}"><table>
          <thead><tr><th>Fecha</th><th>Cliente</th><th>Carne</th><th>Libras</th><th>Total</th><th>Ganancia</th><th>Método</th><th>Estado</th></tr></thead>
          <tbody>
            ${[...ventasSemana].sort((a,b)=>a.fecha.localeCompare(b.fecha)).map(v=>{
              const g = gananciaVenta(v, prom);
              const metodo = v.metodoPago || 'efectivo';
              const total = v.libras * v.precioLibra;
              const estado = estadoVenta(v);
              const saldo = Math.max(total - montoPagadoVenta(v), 0);
              const etiquetaEstado = estado === 'pagado' ? 'Pagado' : estado === 'abono' ? `Abono · debe ${money(saldo)}` : 'Pendiente';
              return `<tr><td>${v.fecha}</td><td><span class="cliente-tag">${v.cliente}</span></td><td>${v.tipo}</td><td class="num">${fmt(v.libras)} lb</td><td class="num">${money(total)}</td><td class="num ${g>=0?'pos':'neg'}">${money(g)}</td><td><span class="metodo-tag ${metodo}">${metodo==='transferencia'?'Transferencia':'Efectivo'}</span></td><td><span class="estado-tag ${estado}" style="cursor:default;">${etiquetaEstado}</span></td></tr>`;
            }).join('')}
          </tbody>
        </table></div>`}`}
      </div>

      <div class="card">
        <h2>Compras — ${mesLabel(mesResumenActual)}</h2>
        ${r.comprasMes.length===0 ? '<div class="empty">Sin compras este mes.</div>' : `
        <div style="overflow-x:auto;"><table>
          <thead><tr><th>Fecha</th><th>Carne</th><th>Libras</th><th>Costo total</th></tr></thead>
          <tbody>
            ${[...r.comprasMes].sort((a,b)=>a.fecha.localeCompare(b.fecha)).map(c=>`<tr><td>${c.fecha}</td><td>${c.tipo}</td><td class="num">${fmt(c.libras)} lb</td><td class="num">${money(c.libras*c.costoLibra)}</td></tr>`).join('')}
          </tbody>
        </table></div>`}
      </div>

      <div class="card">
        <h2>Gastos — ${mesLabel(mesResumenActual)}</h2>
        ${r.gastosMes.length===0 ? '<div class="empty">Sin gastos este mes.</div>' : `
        <div style="overflow-x:auto;"><table>
          <thead><tr><th>Fecha</th><th>Concepto</th><th>Monto</th></tr></thead>
          <tbody>${[...r.gastosMes].sort((a,b)=>a.fecha.localeCompare(b.fecha)).map(g=>`<tr><td>${g.fecha}</td><td>${g.concepto}</td><td class="num">${money(g.monto)}</td></tr>`).join('')}</tbody>
        </table></div>`}
      </div>
    `;
    requestAnimationFrame(()=> window.scrollTo(0, scrollVentanaAnterior));
    document.getElementById('sel-mes-resumen').addEventListener('change', (e)=>{
      mesResumenActual = e.target.value;
      semanaResumenActual = null; // al cambiar de mes, vuelve a empezar en la Semana 1
      renderResumen();
    });

    const selSemana = document.getElementById('sel-semana-resumen');
    if(selSemana){
      selSemana.addEventListener('change', (e)=>{
        semanaResumenActual = e.target.value;
        renderResumen();
      });
    }

    document.getElementById('btn-descargar-pdf').addEventListener('click', ()=>{
      generarPDF(mesResumenActual, r, totalesTipoMes, totalesClienteMes, prom);
    });
  }
  function generarPDF(mesK, r, totalesTipoMes, totalesClienteMes, prom){
    if(!window.jspdf){
      alert('No se pudo cargar el generador de PDF. Revisa tu conexión a internet e inténtalo de nuevo.');
      return;
    }
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    const rojo = [20,20,20];
    const carbon = [60,60,60];
    let y = 18;

    doc.setFont('helvetica','bold');
    doc.setFontSize(18);
    doc.setTextColor(...rojo);
    doc.text('Carnicos Nuevo Amanecer', 14, y);
    y += 7;
    doc.setFontSize(12);
    doc.setTextColor(...carbon);
    doc.text(`Resumen de ${mesLabel(mesK)}`, 14, y);
    y += 10;

    doc.setFontSize(10.5);
    doc.setFont('helvetica','normal');
    const resumenLineas = [
      [`Ganancia bruta del mes:`, money(r.ganancia)],
      [`Total vendido:`, `${fmt(r.librasVendidas)} lb`],
      [`Ventas totales:`, money(r.ventasTotal)],
      [`Gastos del mes:`, money(r.totalGastos)],
      [`Ganancia neta:`, money(r.neto)],
      [`Cobrado en efectivo:`, money(r.totalEfectivo)],
      [`Cobrado por transferencia:`, money(r.totalTransferencia)],
      [`Pendiente por cobrar:`, money(r.totalPendiente)],
    ];
    resumenLineas.forEach(([label,val])=>{
      doc.setFont('helvetica','bold'); doc.text(label, 14, y);
      doc.setFont('helvetica','normal'); doc.text(val, 90, y);
      y += 6;
    });
    y += 4;

    const tiposMes = Object.keys(totalesTipoMes);
    if(tiposMes.length > 0){
      doc.autoTable({
        startY: y,
        head: [['Tipo de carne','Libras vendidas']],
        body: tiposMes.sort().map(t=>[t, `${fmt(totalesTipoMes[t])} lb`]),
        theme:'grid', headStyles:{ fillColor: carbon }, styles:{ fontSize:9 }, margin:{left:14,right:14}
      });
      y = doc.lastAutoTable.finalY + 8;
    }

    const clientesMes = Object.keys(totalesClienteMes);
    if(clientesMes.length > 0){
      doc.setFont('helvetica','bold'); doc.setFontSize(11); doc.text('Total por cliente', 14, y); y += 2;
      doc.autoTable({
        startY: y + 4,
        head: [['Cliente','Libras (todas las carnes)','Total venta','Pagado','Debe']],
        body: clientesMes.sort().map(c=>{
          const t = totalesClienteMes[c];
          return [c, `${fmt(t.libras)} lb`, money(t.total), money(t.pagado), t.saldo>0.004?money(t.saldo):'—'];
        }),
        theme:'grid', headStyles:{ fillColor: rojo }, styles:{ fontSize:9 }, margin:{left:14,right:14}
      });
      y = doc.lastAutoTable.finalY + 8;
    }

    if(r.ventasMes.length > 0){
      if(y > 250){ doc.addPage(); y = 18; }
      doc.setFont('helvetica','bold'); doc.setFontSize(11); doc.text('Ventas por cliente (detalle)', 14, y); y += 2;
      doc.autoTable({
        startY: y + 4,
        head: [['Fecha','Cliente','Carne','Libras','Total','Método','Estado']],
        body: [...r.ventasMes].sort((a,b)=>a.fecha.localeCompare(b.fecha)).map(v=>{
          const total = v.libras * v.precioLibra;
          const estado = estadoVenta(v);
          const saldo = Math.max(total - montoPagadoVenta(v), 0);
          const estadoTxt = estado === 'pagado' ? 'Pagado' : estado === 'abono' ? `Abono (debe ${money(saldo)})` : 'Pendiente';
          const metodo = (v.metodoPago||'efectivo') === 'transferencia' ? 'Transferencia' : 'Efectivo';
          return [v.fecha, v.cliente, v.tipo, `${fmt(v.libras)} lb`, money(total), metodo, estadoTxt];
        }),
        theme:'grid', headStyles:{ fillColor: carbon }, styles:{ fontSize:8.5 }, margin:{left:14,right:14}
      });
      y = doc.lastAutoTable.finalY + 8;
    }

    if(r.comprasMes.length > 0){
      if(y > 250){ doc.addPage(); y = 18; }
      doc.setFont('helvetica','bold'); doc.setFontSize(11); doc.text('Compras', 14, y); y += 2;
      doc.autoTable({
        startY: y + 4,
        head: [['Fecha','Carne','Libras','Costo total']],
        body: [...r.comprasMes].sort((a,b)=>a.fecha.localeCompare(b.fecha)).map(c=>[c.fecha, c.tipo, `${fmt(c.libras)} lb`, money(c.libras*c.costoLibra)]),
        theme:'grid', headStyles:{ fillColor: carbon }, styles:{ fontSize:8.5 }, margin:{left:14,right:14}
      });
      y = doc.lastAutoTable.finalY + 8;
    }

    if(r.gastosMes.length > 0){
      if(y > 250){ doc.addPage(); y = 18; }
      doc.setFont('helvetica','bold'); doc.setFontSize(11); doc.text('Gastos', 14, y); y += 2;
      doc.autoTable({
        startY: y + 4,
        head: [['Fecha','Concepto','Monto']],
        body: [...r.gastosMes].sort((a,b)=>a.fecha.localeCompare(b.fecha)).map(g=>[g.fecha, g.concepto, money(g.monto)]),
        theme:'grid', headStyles:{ fillColor: rojo }, styles:{ fontSize:8.5 }, margin:{left:14,right:14}
      });
    }

    doc.save(`carniceria-resumen-${mesK}.pdf`);
  }
  cargarDatos().then(()=>sincronizar());
})();
</script></body></html>
